name: Wails Windows Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5' 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to System Path
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path $nsisPath)) {
              $nsisPath = "C:\Program Files\NSIS"
          }
          echo "$nsisPath" >> $env:GITHUB_PATH
          echo "NSIS path found at: $nsisPath"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App (Windows Installer)
        run: wails build -clean -m -nsis

      - name: Rename Executable for Website Compatibility
        run: |
          $binPath = "build\bin"
          $installer = Get-ChildItem -Path $binPath -Filter "*-installer.exe" | Select-Object -First 1
          
          if ($installer) {
              Write-Host "Found installer: $($installer.Name)"
              Rename-Item -Path $installer.FullName -NewName "screamcursor.exe"
          } else {
              Write-Error "CRITICAL: NSIS Installer still not found!"
              exit 1
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/screamcursor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}